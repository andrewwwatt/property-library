<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Property Library — Map View</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#f5f3ef;color:#333}
header{background:#1a1a1a;color:#fff;padding:0}
.hi{max-width:1300px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hi h1{font-size:18px;font-family:Georgia,serif;color:#c9a84c;font-style:italic;letter-spacing:-.01em}
.hi .links a{color:#aaa;font-size:12px;text-transform:uppercase;letter-spacing:.06em;text-decoration:none;margin-left:14px}
.hi .links a:hover{color:#fff}
.wrap{max-width:1300px;margin:0 auto;padding:16px 20px 40px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.toolbar label{font-size:12px;color:#666;margin-right:4px}
.toolbar select,.toolbar input[type=text]{padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.chip{display:inline-block;background:#f0ece4;border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;border:1px solid transparent;user-select:none}
.chip.active{background:#c9a84c;color:#1a1a1a;font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:#555;align-items:center}
.legend .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
#map{height:600px;border-radius:12px;border:1px solid #ddd;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:1}
.count{font-size:12px;color:#888;margin-left:auto}
/* Popup */
.leaflet-popup-content{font-size:13px;line-height:1.5}
.leaflet-popup-content h3{font-size:15px;margin-bottom:4px;color:#1a1a1a}
.pp{color:#a00;font-size:11px}
.prop{color:#3a7d44;font-size:11px}
.tag{display:inline-block;background:#f0ece4;border-radius:10px;padding:1px 8px;font-size:10px;margin:2px 2px 0 0;color:#555}
.notes{background:#faf8f4;border-left:3px solid #c9a84c;padding:6px 10px;margin-top:6px;font-size:12px;color:#444;border-radius:0 6px 6px 0}
/* Edit form */
.frm{margin-top:8px;border-top:1px solid #eee;padding-top:8px}
.frm input,.frm textarea{width:100%;padding:5px 8px;border:1px solid #ddd;border-radius:5px;font-size:12px;margin-bottom:6px;font-family:inherit}
.frm textarea{min-height:50px}
.frm button{background:#1a1a1a;color:#fff;border:none;border-radius:5px;padding:5px 14px;font-size:12px;cursor:pointer}
.frm button:hover{background:#333}
.saved{color:#3a7d44;font-size:11px;display:none;margin-top:4px}
.footer{text-align:center;color:#999;font-size:11px;padding:16px 0}
</style>
</head>
<body>
<header><div class="hi">
  <h1>📊 Property Library — Map View</h1>
  <div class="links">
    <a href="index.html">List View</a>
    <a href="#" onclick="return false" style="color:#c9a84c;font-weight:700">Map View</a>
  </div>
</div></header>
<div class="wrap">
<div class="toolbar">
  <label>Owner tenure:</label>
  <select id="fTenure" onchange="applyFilters()">
    <option value="">All</option>
    <option value="Owner Occupied">Owner Occupied</option>
    <option value="Tenant Occupied">Tenant Occupied</option>
  </select>
  <label>Status:</label>
  <select id="fListed" onchange="applyFilters()">
    <option value="">All</option>
    <option value="false">Not on sale</option>
    <option value="true">On sale</option>
  </select>
  <label>Search:</label>
  <input type="text" id="fSearch" placeholder="Address, tag, note…" oninput="applyFilters()" style="width:180px">
  <span class="legend">
    <span><span class="dot" style="background:#3a7d44"></span>Owner occ.</span>
    <span><span class="dot" style="background:#c08a3e"></span>Tenant</span>
    <span><span class="dot" style="background:#c9a84c"></span>On sale</span>
    <span><span class="dot" style="background:#999"></span>Filtered out</span>
  </span>
  <span class="count" id="count"></span>
</div>
<div id="map"></div>
<p class="footer">Map data © OpenStreetMap contributors · Click a marker to view &amp; add intel · Data saves in this browser</p>
</div>

<script>
var map = L.map('map').setView([-33.9196, 18.3870], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

var properties = [];
var markers = {};

// Load base data
fetch('data.json').then(function(r){ return r.json(); }).then(function(data){
  properties = data;
  // Merge proprietary intel from localStorage
  var intel = {};
  try { intel = JSON.parse(localStorage.getItem('pl-intel') || '{}'); } catch(e) {}
  properties.forEach(function(p){
    if(intel[p.id]) { p.ownerContact = intel[p.id].ownerContact || p.ownerContact; p.notes = intel[p.id].notes || p.notes; p.intel = intel[p.id]; }
  });
  buildMarkers();
  applyFilters();
}).catch(function(e){ console.error('Failed to load data.json:', e); });

function markerColor(p){
  if(p.listed) return '#c9a84c';          // on sale
  if(p.ownerStatus === 'Tenant Occupied') return '#c08a3e';
  return '#3a7d44';                        // owner occupied
}

function buildMarkers(){
  properties.forEach(function(p){
    var m = L.circleMarker([p.lat, p.lng], {
      radius: 10, fillColor: markerColor(p), fillOpacity: 0.85,
      color: '#fff', weight: 2
    }).addTo(map);
    m.bindPopup(popupHtml(p));
    m.on('click', function(){ m.openPopup(); });
    markers[p.id] = m;
  });
}

function popupHtml(p){
  var tags = (p.tags||[]).map(function(t){ return '<span class="tag">'+t+'</span>'; }).join('');
  var sale = p.listed ? '<span class="pp">● ON SALE</span>' : '<span class="prop">● NOT LISTED</span>';
  var contact = p.ownerContact ? '<div><b>Contact:</b> '+p.ownerContact+'</div>' : '';
  var notes = p.notes ? '<div class="notes">📌 '+p.notes+'</div>' : '';
  return '<h3>'+p.address+'</h3>'+
    '<div>'+p.type+' · '+p.beds+' bed / '+p.baths+' bath · '+p.size+'m²</div>'+
    '<div>Valuation: R'+(p.currentValuation/1000000).toFixed(1)+'m · Last sale: R'+(p.lastSalePrice/1000000).toFixed(1)+'m</div>'+
    '<div>'+p.ownerStatus+' '+sale+'</div>'+tags+contact+notes+
    '<div class="frm">'+
    '<input id="ct-'+p.id+'" placeholder="Owner contact (phone / email)" value="'+(p.intel && p.intel.ownerContact ? p.intel.ownerContact : '')+'">'+
    '<textarea id="nt-'+p.id+'" placeholder="Intel / notes (e.g. renovating, planning to sell…)">'+(p.intel && p.intel.notes ? p.intel.notes : '')+'</textarea>'+
    '<button onclick="saveIntel(\''+p.id+'\')">Save intel</button>'+
    '<div class="saved" id="sv-'+p.id+'">✓ Saved to browser</div></div>';
}

function saveIntel(id){
  var p = properties.find(function(x){ return x.id === id; });
  var intel = {};
  try { intel = JSON.parse(localStorage.getItem('pl-intel') || '{}'); } catch(e) {}
  intel[id] = { ownerContact: document.getElementById('ct-'+id).value, notes: document.getElementById('nt-'+id).value };
  localStorage.setItem('pl-intel', JSON.stringify(intel));
  document.getElementById('sv-'+id).style.display = 'block';
  setTimeout(function(){ document.getElementById('sv-'+id).style.display = 'none'; }, 2000);
  // Update marker popup
  markers[id].setPopupContent(popupHtml(p));
}

function applyFilters(){
  var tenure = document.getElementById('fTenure').value;
  var listed = document.getElementById('fListed').value;
  var q = document.getElementById('fSearch').value.toLowerCase();
  var shown = 0, count = 0;
  properties.forEach(function(p){
    count++;
    var ok = true;
    if(tenure && p.ownerStatus !== tenure) ok = false;
    if(listed !== '' && String(p.listed) !== listed) ok = false;
    if(q){
      var hay = (p.address+' '+(p.tags||[]).join(' ')+' '+(p.notes||'')).toLowerCase();
      if(hay.indexOf(q) === -1) ok = false;
    }
    if(ok){
      shown++;
      markers[p.id].setStyle({fillOpacity: 0.85, radius: 10});
      markers[p.id].setTooltipContent ? '' : '';
      markers[p.id].bindTooltip(p.address, {permanent:false});
    } else {
      markers[p.id].setStyle({fillOpacity: 0.15, radius: 6});
    }
  });
  document.getElementById('count').textContent = shown + ' of ' + count + ' shown';
}
</script>
</body>
</html>
